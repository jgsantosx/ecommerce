# Propriedades exclusivas dos testes.
# Este arquivo fica em classpath:/config/ e por isso e carregado JUNTO com o
# application.properties principal, com prioridade maior (nao o substitui).

# Secret ficticia, usada apenas nos testes. Nao e usada em nenhum ambiente real.
security.jwt.secret=test-only-jwt-secret-not-for-production-0123456789

# Uploads dos testes ficam dentro de target/ (apagado pelo "mvn clean").
app.storage.local.base-dir=target/test-uploads

# Testes nunca criam o admin inicial, mesmo que a maquina tenha ADMIN_EMAIL definido.
app.admin.email=
app.admin.password=

# Menos ruido no log dos testes.
spring.jpa.show-sql=false
