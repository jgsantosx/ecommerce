spring.application.name=ecommerce

# Banco de dados. Os valores padrao (apos os dois pontos) servem para o
# ambiente local com o docker-compose; em outros ambientes, use variaveis.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Secret usada para assinar e validar os tokens JWT (HS256, minimo 32 bytes).
# Nunca coloque o valor real aqui: defina a variavel de ambiente SECURITY_JWT_SECRET.
security.jwt.secret=${SECURITY_JWT_SECRET}

# Origens (frontend) autorizadas a chamar a API pelo navegador. Separe por virgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Administrador inicial: criado na subida da aplicacao se as duas variaveis
# estiverem definidas e o e-mail ainda nao existir. Sem elas, nada acontece.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Pagamento: provider ativo. "fake" simula aprovacoes sem gateway real.
app.payment.provider=${PAYMENT_PROVIDER:fake}

# Upload de imagens
app.storage.local.base-dir=${STORAGE_LOCAL_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Observabilidade basica: apenas /actuator/health exposto, sem detalhes internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
