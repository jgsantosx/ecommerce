# Nome fixo do projeto: garante o mesmo container e volume do banco
# independentemente da pasta de onde o comando for executado.
name: ecommerce

services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Os serviços abaixo só sobem com o perfil "app":
  #   docker compose --profile app up -d --build
  # Sem o perfil, "docker compose up -d" continua subindo apenas o banco
  # (o fluxo de desenvolvimento local de sempre).

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      # O Docker Compose LÊ o arquivo .env da raiz e substitui ${...} abaixo.
      # ":?" faz o compose recusar subir se a variável não estiver definida.
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?defina SECURITY_JWT_SECRET no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JPA_SHOW_SQL: "false"
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  uploads_data:
