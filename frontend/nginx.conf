server {
    listen 80;
    root /usr/share/nginx/html;

    # Mesmo limite do backend (6MB por requisição de upload).
    client_max_body_size 6m;

    # Chamadas à API vão para o container do backend (mesma origem para o navegador).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas como /orders/5 não existem como arquivo; devolvemos o index.html
    # e o React Router resolve a rota no navegador.
    location / {
        try_files $uri /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
